<!DOCTYPE html>
<html>
<head>
    <title>Formulario de prueba de HTML5</title>
	<meta charset="utf-8"/>
</head>
 <h1>Formulario de prueba de HTML5</h1>
<form action="https://lm.ciclo.iesnervion.es/registroweb.php" method="get" >
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" autofocus required><br><br>

      <label for="email" >Correo electrónico:</label>
     <input type="email" id="email" name="email" required><br><br>

    <label for="web">Escribe la URL de tu página web personal</label>
    <input type="url" id="web" name="web"><br><br>

    <label for="fecha">Fecha</label>
    <input type="date" id="fecha" name="fecha" min="2026-11-13" max="2026-12-15"><br><br>

    <label for="time">Tiempo</label>
    <input type="time" id="time" name="time"><br><br>

    <label for="fecha">Fecha y hora</label>
    <input type="datetime-local" id="fecha" name="fecha" min="2026-11-13T00:00" max="2026-12-15T23:59"><br><br>


    <label for="mes">Mes</label>
    <input type="month" id="mes" name="mes"><br><br>


    <label for="semana">Semana</label>
    <input type="week" id="semana" name="semana"><br><br>

       <label for="numero">Numero</label>
    <input type="number" id="numero" name="numero" min="-10" max="10"><br><br>

         <label for="tel">Teléfono</label>
    <input type="number" id="tel" name="tel"><br><br>

         <label for="busqueda">Búsqueda</label>
    <input type="search" id="busqueda" name="busqueda"><br><br>


    <label for="color">Color favorito</label>
    <input type="color" id="color" name="color"><br><br>

    <br><button type="submit">Enviar encuesta</button>>
