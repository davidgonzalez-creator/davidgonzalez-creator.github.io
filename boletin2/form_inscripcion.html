<!DOCTYPE html>
<html>
<head>
    <title>Inscripción</title>
	<meta charset="utf-8"/>
</head>
<body>
    <h1>Formulario de Inscripción</h1>
<form action="https://lm.ciclo.iesnervion.es/inscripcion.php" method="post" enctype="multipart/form-data">
    <label for="equipo">Nombre del Equipo</label>
    <input type="text" id="equipo" name="equipo" autofocus><br><br>
    <label for="codigo_registro">Código del Registro</label>
    <input type="text" id="codigo_registro" name="codigo_registro" value="HACK-2026-SEV" readonly><br><br>
    <label for="fecha">Fecha de llegada</label>
    <input type="date" id="fecha" name="fecha" min="2026-12-01" max="2026-12-15"><br><br>
    <label for="hora">Hora de llegada</label>
    <input type="time" id="hora" name="hora" min="08:00" max="20:00"><br><br>
    <label for="color">Color del equipo:</label>
<input type="color" id="color" name="color">
<label for="nivel_java">Nivel estimado de Java:</label>
<input type="range" id="nivel_java" name="nivel_java"
       min="0" max="100" step="5">
       <label for="expediente">Subir Expediente:</label>
       <input type="file" id="expediente" name="expediente" accept=".pdf,.doc,.docx">
       <button type="submit">Enviar Formulario</button>

</form>
</body>
</html>
