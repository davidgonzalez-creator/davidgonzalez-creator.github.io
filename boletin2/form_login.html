<!DOCTYPE html>
<html>
<head>
    <title>Formulario</title>
	<meta charset="utf-8"/>
</head>
    <body>

<h1>Iniciar sesión</h1>
<form action="https://lm.ciclo.iesnervion.es/login.php" method="POST">
    <label for="usuario">Nombre de usuario o email:</label>
    <input type="text" id="usuario" name="usuario" required placeholder="usuario@dominio.com"><br><br>
    <label for="contrasena">Contraseña:</label>
    <input type="password" id="contrasena" name="contrasena" required>
    <input type="checkbox" id="recordar" name="recordar">
    <label for="recordar">Recordar sesión</label><br><br>
    <button type="submit">Iniciar sesión</button>
</form>
    </body>
</html>
